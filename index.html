<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Dashboard v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sec: #94a3b8;
            --accent: #38bdf8;
            --highlight: #818cf8;
            --border: #334155;
            --card-height: 400px; /* Sedikit tinggi untuk muat info tambahan */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        /* --- Header Section --- */
        .header-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        #time { font-size: 4rem; font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -1px; }
        #date { font-size: 1.2rem; color: var(--text-sec); margin-top: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;}

        /* --- General Card Styling --- */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            height: var(--card-height); 
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--highlight);
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        h2 i { color: var(--accent); }

        .card-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .card-content::-webkit-scrollbar { width: 6px; }
        .card-content::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        /* --- List Items --- */
        ul { list-style: none; padding: 0; margin: 0; }
        
        li {
            padding: 14px 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Align top for multi-line details */
            gap: 15px;
        }
        li:last-child { border-bottom: none; }

        .info-col { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .meta-col { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 90px;}

        .main-text { font-weight: 600; font-size: 1rem; color: #fff; }
        .sub-text { font-size: 0.85rem; color: var(--text-sec); display: flex; align-items: center; gap: 6px; }
        
        /* Kelas Specific Detail */
        .detail-row { font-size: 0.8rem; color: #cbd5e1; display: flex; gap: 10px; margin-top: 4px;}
        .detail-item { display: flex; align-items: center; gap: 5px; background: #334155; padding: 2px 6px; border-radius: 4px;}

        .badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-time { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .badge-date { background: rgba(148, 163, 184, 0.15); color: var(--text-sec); }
        .badge-duration { background: rgba(129, 140, 248, 0.15); color: var(--highlight); border: 1px solid rgba(129, 140, 248, 0.3); }

        /* Quick Links Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .link-btn {
            background-color: #283445;
            color: var(--text-main);
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: 80px;
            justify-content: center;
        }
        .link-btn:hover { background-color: var(--highlight); color: #fff; }

        .loading { text-align: center; color: var(--text-sec); padding-top: 60px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <div id="time">00:00:00</div>
            <div id="date">--</div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-briefcase"></i> Meeting & Mesyuarat</h2>
            <div class="card-content" id="meeting-list">
                <div class="loading">Memuatkan...</div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-chalkboard-user"></i> Jadual Kelas</h2>
            <div class="card-content" id="kelas-list">
                <div class="loading">Memuatkan...</div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-umbrella-beach"></i> Cuti & Pelepasan</h2>
            <div class="card-content" id="cuti-list">
                <div class="loading">Memuatkan...</div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-list-check"></i> Senarai Tugas</h2>
            <div class="card-content" id="todo-list">
                <div class="loading">Memuatkan...</div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-link"></i> Capaian Pantas</h2>
            <div class="card-content">
                <div id="links-list" class="links-grid">
                    <div class="loading">Memuatkan...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- GANTI URL DI SINI ---
        const DATA_URL = https://script.google.com/macros/s/AKfycbxg_RqRkZakGDh8LQms_sFnhryExnNdW3Fccyhk4ryksPYd_WX-WKqE_tV2j20P_1SJlQ/exec; 

        // 1. Clock
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US', { hour12: false });
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('ms-MY', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. Fetch Data
        async function fetchData() {
            if(DATA_URL.includes("GANTI")) return;
            try {
                const response = await fetch(DATA_URL);
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error("Error:", error);
            }
        }

        // 3. Render
        function renderDashboard(data) {
            
            // --- KELAS (NEW LOGIC) ---
            const kelasHTML = data.kelas.map(item => {
                const dateObj = new Date(item.Tarikh);
                const dateDisplay = isNaN(dateObj) ? item.Tarikh : `${dateObj.getDate()}/${dateObj.getMonth()+1}`;
                const dayName = isNaN(dateObj) ? '' : dateObj.toLocaleDateString('ms-MY', { weekday: 'short' });
                
                // Kira Tempoh
                const duration = calculateDuration(item.MasaMula, item.MasaTamat);

                return `
                <li>
                    <div class="info-col">
                        <span class="main-text">${item.Subjek}</span>
                        <div class="detail-row">
                             <span class="detail-item"><i class="fa-regular fa-clock"></i> ${formatTimeOnly(item.MasaMula)}</span>
                             <span class="detail-item"><i class="fa-solid fa-location-dot"></i> ${item.Lokasi}</span>
                        </div>
                    </div>
                    <div class="meta-col">
                        <span class="badge badge-date">${dateDisplay} (${dayName})</span>
                        <span class="badge badge-duration"><i class="fa-solid fa-hourglass-half"></i> ${duration}</span>
                    </div>
                </li>
            `}).join('');
            document.getElementById('kelas-list').innerHTML = `<ul>${kelasHTML}</ul>`;


            // --- MEETING ---
            const meetingHTML = data.meeting.map(item => {
                const dateObj = new Date(item.Tarikh);
                const dayName = isNaN(dateObj) ? '' : dateObj.toLocaleDateString('ms-MY', { weekday: 'short' });
                const dateFormatted = isNaN(dateObj) ? item.Tarikh : `${dateObj.getDate()}/${dateObj.getMonth()+1}`;
                return `
                <li>
                    <div class="info-col">
                        <span class="main-text">${item.Agenda}</span>
                        <span class="sub-text"><i class="fa-solid fa-location-dot"></i> ${item.Lokasi || 'Online'}</span>
                    </div>
                    <div class="meta-col">
                        <span class="badge badge-time">${formatTimeOnly(item.Masa)}</span>
                        <span class="badge badge-date">${dateFormatted} (${dayName})</span>
                    </div>
                </li>
            `}).join('');
            document.getElementById('meeting-list').innerHTML = `<ul>${meetingHTML}</ul>`;

            // --- CUTI ---
            const cutiHTML = data.cuti.map(item => {
                const start = formatDate(item.TarikhMula);
                const end = formatDate(item.TarikhTamat);
                const displayDate = (start === end) ? start : `${start} - ${end}`;
                return `
                <li>
                    <div class="info-col"><span class="main-text">${item.NamaCuti}</span></div>
                    <div class="meta-col"><span class="badge badge-date">${displayDate}</span></div>
                </li>
            `}).join('');
            document.getElementById('cuti-list').innerHTML = `<ul>${cutiHTML}</ul>`;

            // --- TODO ---
            const todoHTML = data.todo.map(item => {
                const isDone = item.Status === 'Done';
                return `
                <li style="opacity: ${isDone ? '0.6' : '1'}">
                    <div class="info-col"><span class="main-text" style="${isDone ? 'text-decoration: line-through;' : ''}">${item.Tugasan}</span></div>
                    <div class="meta-col">
                        <span class="badge" style="background: ${isDone ? '#064e3b' : '#7f1d1d'}; color: ${isDone ? '#34d399' : '#f87171'}">${item.Status}</span>
                    </div>
                </li>
            `}).join('');
            document.getElementById('todo-list').innerHTML = `<ul>${todoHTML}</ul>`;

            // --- LINKS ---
            const linksHTML = data.links.map(item => `
                <a href="${item.URL}" target="_blank" class="link-btn">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>${item.Tajuk}</span>
                </a>
            `).join('');
            document.getElementById('links-list').innerHTML = linksHTML;
        }

        // --- Helpers ---
        function formatTimeOnly(val) {
            if(!val) return "";
            if(val.toString().includes("T") || val instanceof Date) {
                return new Date(val).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', hour12: false});
            }
            return val; // Jika user tulis manual text
        }

        function calculateDuration(start, end) {
            if(!start || !end) return "--";
            
            // Cuba parse sebagai Date object
            const s = new Date(start);
            const e = new Date(end);

            if(isNaN(s) || isNaN(e)) return "Check Data"; // Error handling

            const diffMs = e - s; // beza masa dalam milisaat
            const diffMins = Math.floor(diffMs / 60000);
            
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;

            if(hours > 0 && mins > 0) return `${hours}j ${mins}m`;
            if(hours > 0) return `${hours} Jam`;
            return `${mins} Minit`;
        }

        function formatDate(val) {
            if(!val) return "";
            const d = new Date(val);
            if(isNaN(d.getTime())) return val;
            return `${d.getDate()}/${d.getMonth()+1}`;
        }

        fetchData();
        setInterval(fetchData, 30000); 

    </script>
</body>
</html>
